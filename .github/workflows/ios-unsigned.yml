# iOS remote-only unsigned IPA (personal sideload build, fork only).
#
# dsh-Go upstream is Android-only (no app/ios). This branch adds a minimal
# iOS Runner plus Dart-side remote-only gating (marked "iOS remote-only
# build" in the touched files) and builds an unsigned IPA on a macOS runner.
#
# No Release is created: the IPA is only a workflow artifact for the owner's
# own sideloading. Do not publish it anywhere.
name: iOS unsigned IPA (remote-only)

on:
  push:
    branches: [ios-remote-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    # macos-15 (arm64) repeatedly failed to acquire a runner
    # ("job was not acquired ... capacity constraints", 2026-11-06, twice).
    # macos-15-intel is the same image family (same Xcode 26.x set) on the
    # Intel capacity pool; an iOS arm64 IPA cross-compiles fine there.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.47.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        # connectivity_plus 7.1+ needs the iOS 26 SDK (NWPath.isUltraConstrained);
        # macos-15 defaults to Xcode 16.4, which cannot compile it. Pick the
        # newest installed Xcode 26.x instead of hard-coding a patch version,
        # so weekly image updates don't break the pin.
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          test -n "$XCODE" || { echo "::error::No Xcode 26 on this runner image"; ls /Applications/ | grep -i xcode; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build unsigned IPA
        working-directory: app
        run: >
          flutter build ipa --no-codesign
          --build-name 1.0.11
          --build-number ${{ github.run_number }}

      # --no-codesign archives but skips IPA export ("Codesigning disabled
      # with --no-codesign, skipping IPA"), so package the unsigned .app
      # from the archive into an IPA by hand: Payload/Runner.app zipped.
      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::No Runner.app in archive"; find build/ios/archive -maxdepth 4 | head; exit 1; }
          rm -rf /tmp/dsh-ipa && mkdir -p /tmp/dsh-ipa/Payload
          cp -r "$APP" /tmp/dsh-ipa/Payload/
          mkdir -p build/ios/ipa
          (cd /tmp/dsh-ipa && zip -r -y "$GITHUB_WORKSPACE/app/build/ios/ipa/dsh-go-ios-remote-only.ipa" Payload)
          ls -la build/ios/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-remote-only
          path: app/build/ios/ipa/*.ipa
          retention-days: 30
