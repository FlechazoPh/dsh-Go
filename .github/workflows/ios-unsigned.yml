# iOS remote-only unsigned IPA (personal sideload build, fork only).
#
# dsh-Go upstream is Android-only (no app/ios). This branch adds a minimal
# iOS Runner plus Dart-side remote-only gating (marked "iOS remote-only
# build" in the touched files) and builds an unsigned IPA on a macOS runner.
#
# This workflow only uploads the IPA as an artifact. Public distribution is
# done by the upstream-sync workflow (or manually with `gh release create`):
# it builds the same IPA and attaches it to a public `ios-vX.Y.Z` release.
# Since 2026-11-09 the owner distributes the iOS build via public releases.
name: iOS unsigned IPA (remote-only)

on:
  push:
    branches: [ios-remote-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    # Round 4 (2026-11-08): try the `xcode-27` image (macOS 27, Xcode 27.0
    # default in /Applications/Xcode_27.app) so the Live Activity widget
    # extension can use the iOS 27 SDK. `macos-26` only ships Xcode 26.x
    # and `macos-26-arm64` is not a valid label (jobs queue forever).
    # Fallback if this image cannot be acquired / cannot build: back to
    # macos-15-intel + Xcode 26 (ActivityKit works there too, just without
    # the iOS 27-only symbols, which the Swift code gates with
    # `#if compiler(>=6.3)`).
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.47.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        # connectivity_plus 7.1+ needs the iOS 26 SDK (NWPath.isUltraConstrained);
        # the xcode-27 image ships Xcode 27.x. Pick the newest installed
        # Xcode 27.x instead of hard-coding a patch version, so image
        # updates don't break the pin. If no Xcode 27 is on the image,
        # fail loudly and list what is there.
        run: |
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$XCODE" || { echo "::error::No Xcode 27 on this runner image"; ls /Applications/ | grep -i xcode; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build unsigned IPA
        working-directory: app
        # --build-name comes from pubspec.yaml so an upstream sync only has
        # to bump the version there; --build-number is the run number.
        run: |
          VER="$(grep '^version:' pubspec.yaml | sed 's/^version: *//; s/+.*//')"
          flutter build ipa --no-codesign --build-name "$VER" --build-number ${{ github.run_number }}

      # --no-codesign archives but skips IPA export ("Codesigning disabled
      # with --no-codesign, skipping IPA"), so package the unsigned .app
      # from the archive into an IPA by hand: Payload/Runner.app zipped.
      - name: Package unsigned IPA
        working-directory: app
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::No Runner.app in archive"; find build/ios/archive -maxdepth 4 | head; exit 1; }
          rm -rf /tmp/dsh-ipa && mkdir -p /tmp/dsh-ipa/Payload
          cp -r "$APP" /tmp/dsh-ipa/Payload/
          mkdir -p build/ios/ipa
          (cd /tmp/dsh-ipa && zip -r -y "$GITHUB_WORKSPACE/app/build/ios/ipa/dsh-go-ios-remote-only.ipa" Payload)
          ls -la build/ios/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-remote-only
          path: app/build/ios/ipa/*.ipa
          retention-days: 30
